<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="core" cx="50%" cy="45%">
      <stop offset="0%" stop-color="#ffffff"></stop>
      <stop offset="35%" stop-color="#7dd3fc"></stop>
      <stop offset="70%" stop-color="#2563eb"></stop>
      <stop offset="100%" stop-color="#080b12"></stop>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="#080b12"></rect>

  <circle cx="32" cy="32" r="22" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.45"></circle>

  <circle cx="32" cy="32" r="17" fill="url(#core)" filter="url(#glow)"></circle>

  <circle cx="32" cy="32" r="11" fill="#080b12" opacity="0.85"></circle>

  <text x="32" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">N</text>
</svg>